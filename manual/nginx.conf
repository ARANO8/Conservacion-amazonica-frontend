# Servidor interno de la imagen `manual`. Recibe la ruta completa
# (/amzdesk/manual/...) desde el proxy `edge`, que es quien exige la sesión
# para el manual técnico.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirecciones relativas: el TLS lo termina un proxy anterior
    absolute_redirect off;

    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los assets llevan hash en el nombre: se pueden cachear sin miedo
    location ~* /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /amzdesk/manual/tecnico/ {
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /amzdesk/manual/tecnico/404.html;
    }

    location /amzdesk/manual/ {
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /amzdesk/manual/404.html;
    }
}
